<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SevaHub Global</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0f1c;
  color:white;
}

.navbar{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#111827;
  position:sticky;
  top:0;
}

.hero{
  text-align:center;
  padding:70px 20px;
  background:linear-gradient(135deg,#1e3a8a,#06b6d4);
}

.section{
  padding:30px;
  text-align:center;
}

.form{
  max-width:420px;
  margin:auto;
  background:#111827;
  padding:20px;
  border-radius:12px;
}

input,select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:6px;
}

button{
  width:100%;
  padding:10px;
  background:#38bdf8;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.card{
  background:#1f2937;
  padding:12px;
  margin:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="navbar">
  <b>SevaHub Global</b>
</div>

<div class="hero">
  <h1>Global Service Network</h1>
  <p>Multi-city scalable platform (India ready → Global ready)</p>
</div>

<div class="section">

<h2>Book Service</h2>

<div class="form">
  <input id="name" placeholder="Name">
  <input id="phone" placeholder="Phone">

  <select id="service">
    <option>Massage</option>
    <option>Cleaning</option>
    <option>Tutor</option>
    <option>Electrician</option>
  </select>

  <input id="city" placeholder="City">
  <input id="area" placeholder="Area">

  <button onclick="book()">Submit</button>
</div>

</div>

<div class="section">
  <h2>Live Bookings</h2>
  <div id="data"></div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "PASTE",
  authDomain: "PASTE",
  projectId: "PASTE",
  storageBucket: "PASTE",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* GLOBAL BOOKING */
function book(){

  let data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    service: document.getElementById("service").value,
    city: document.getElementById("city").value,
    area: document.getElementById("area").value,
    time: Date.now()
  };

  if(!data.name || !data.phone || !data.city){
    alert("Fill required fields");
    return;
  }

  db.collection("global_bookings").add(data);

  alert("Booking sent globally 🚀");
}

/* LIVE GLOBAL DATA */
db.collection("global_bookings")
.orderBy("time","desc")
.onSnapshot(snap=>{

  let box=document.getElementById("data");
  box.innerHTML="";

  snap.forEach(doc=>{
    let d=doc.data();

    box.innerHTML += `
      <div class="card">
        <b>${d.name}</b><br>
        ${d.phone}<br>
        ${d.service}<br>
        ${d.city} - ${d.area}
      </div>
    `;
  });

});

</script>

</body>
</html>
