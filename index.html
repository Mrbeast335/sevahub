<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SevaHub Live</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.navbar{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#111827;
}

.nav-links{
  display:flex;
  gap:15px;
  list-style:none;
}

.nav-links a{
  color:white;
  text-decoration:none;
}

.hero{
  text-align:center;
  padding:50px;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
}

.section{
  padding:30px;
  text-align:center;
}

.form{
  max-width:400px;
  margin:auto;
}

input,select{
  width:100%;
  padding:10px;
  margin:8px 0;
}

button{
  padding:10px;
  width:100%;
  background:#38bdf8;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.card{
  background:#1f2937;
  padding:10px;
  margin:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
  <div><b>SevaHub</b></div>
</div>

<!-- HERO -->
<div class="hero">
  <h1>SevaHub Live</h1>
  <p>Real Booking System with Firebase</p>
</div>

<!-- FORM -->
<div class="section">
  <h2>Book Service</h2>

  <div class="form">
    <input id="name" placeholder="Name">
    <input id="phone" placeholder="Phone">

    <select id="service">
      <option>Massage</option>
      <option>Cleaning</option>
      <option>Tutor</option>
    </select>

    <input id="area" placeholder="Area">

    <button onclick="book()">Book Now</button>
  </div>
</div>

<!-- ADMIN -->
<div class="section">
  <h2>Live Bookings</h2>
  <div id="data"></div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

// 🔥 PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "PASTE",
  authDomain: "PASTE",
  projectId: "PASTE",
  storageBucket: "PASTE",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// BOOKING SAVE
function book(){

  let name=document.getElementById("name").value;
  let phone=document.getElementById("phone").value;
  let service=document.getElementById("service").value;
  let area=document.getElementById("area").value;

  if(!name || !phone || !area){
    alert("Fill all fields");
    return;
  }

  db.collection("bookings").add({
    name, phone, service, area,
    time: new Date()
  });

  alert("Booking Saved 🚀");
}

// LIVE LOAD
db.collection("bookings")
.orderBy("time","desc")
.onSnapshot(snapshot=>{
  let box=document.getElementById("data");
  box.innerHTML="";

  snapshot.forEach(doc=>{
    let d=doc.data();

    box.innerHTML += `
      <div class="card">
        <b>${d.name}</b><br>
        ${d.phone}<br>
        ${d.service} - ${d.area}
      </div>
    `;
  });
});

</script>

</body>
</html>
