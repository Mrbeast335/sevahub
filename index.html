<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SevaHub</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f9;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:#222;
  color:white;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.nav-links{
  list-style:none;
  display:flex;
  gap:20px;
}

.nav-links a{
  text-decoration:none;
  color:white;
}

.nav-links a:hover{
  color:#00c3ff;
}

/* HERO */
.hero{
  padding:40px 20px;
  text-align:center;
  background:white;
}

.buttons{
  margin-top:20px;
}

.btn{
  display:inline-block;
  background:#0d6efd;
  color:white;
  padding:12px 20px;
  margin:10px;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

.btn:hover{
  background:#084298;
}

/* SECTIONS */
.section{
  padding:40px 20px;
}

.section h2{
  text-align:center;
  margin-bottom:25px;
}

/* CARDS */
.cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.card{
  background:white;
  width:280px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  text-align:center;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

/* FOOTER */
footer{
  background:#222;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:30px;
}

/* NEW (only fix needed) */
.request{
  background:white;
  padding:10px;
  border-radius:8px;
  margin:10px;
}
</style>
</head>

<body>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// Firebase config (NO CHANGE)
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// FIXED ONLY SAFETY CHECK
function book(){

  let name = document.getElementById("name")?.value;
  let phone = document.getElementById("phone")?.value;
  let service = document.getElementById("service")?.value;
  let area = document.getElementById("area")?.value;

  if(!name || !phone || !area){
    alert("Fill all details");
    return;
  }

  db.collection("bookings").add({
    name, phone, service, area,
    time: new Date()
  });

  alert("Booking Saved Successfully 🚀");
}

// FIXED: safe load
function loadBookings(){
  const box = document.getElementById("requests");
  if(!box) return;

  db.collection("bookings").orderBy("time","desc")
  .onSnapshot(snapshot => {

    box.innerHTML = "";

    snapshot.forEach(doc => {
      let r = doc.data();

      box.innerHTML += `
        <div class="request">
          <b>${r.name}</b><br>
          ${r.phone}<br>
          ${r.service} - ${r.area}
        </div>
      `;
    });

  });
}

window.onload = loadBookings;
</script>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo">SevaHub</div>
</nav>

<!-- HERO -->
<section class="hero">
  <h2>Find Trusted Local Services Near You</h2>

  <input id="name" placeholder="Your Name"><br>
  <input id="phone" placeholder="Phone"><br>

  <select id="service">
    <option>Head Massage</option>
    <option>Bathroom Cleaning</option>
    <option>Teachers</option>
  </select><br>

  <input id="area" placeholder="Area"><br>

  <div class="buttons">
    <button class="btn" onclick="book()">Book Now</button>
  </div>
</section>

<!-- BOOKINGS -->
<section class="section">
  <h2>Live Bookings</h2>
  <div id="requests" class="cards"></div>
</section>

<footer>
  © 2026 SevaHub | Jamui & Bhagalpur
</footer>

</body>
</html>
