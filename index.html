<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SevaHub District Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

.navbar{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#111827;
  position:sticky;
  top:0;
}

.hero{
  text-align:center;
  padding:60px 20px;
  background:linear-gradient(135deg,#1d4ed8,#06b6d4);
}

.section{
  padding:25px;
  text-align:center;
}

.form{
  max-width:420px;
  margin:auto;
  background:#111827;
  padding:20px;
  border-radius:12px;
}

input,select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:6px;
}

button{
  width:100%;
  padding:10px;
  background:#38bdf8;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.card{
  background:#1f2937;
  padding:12px;
  margin:10px;
  border-radius:10px;
  text-align:left;
}
</style>
</head>

<body>

<div class="navbar">
  <b>SevaHub District Pro</b>
</div>

<div class="hero">
  <h1>Jamui & Bhagalpur Services</h1>
  <p>Fast Local Booking System</p>
</div>

<div class="section">
<h2>Book Service</h2>

<div class="form">

  <input id="name" placeholder="Name">
  <input id="phone" placeholder="Phone">

  <select id="service">
    <option>Head Massage</option>
    <option>Bathroom Cleaning</option>
    <option>Tutor</option>
  </select>

  <select id="city">
    <option>Jamui</option>
    <option>Bhagalpur</option>
  </select>

  <input id="area" placeholder="Area">

  <button onclick="book()">Book Now</button>

</div>
</div>

<div class="section">
  <h2>Live Bookings</h2>
  <div id="data"></div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

// 🔥 PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* BOOKING */
function book(){

  let data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    service: document.getElementById("service").value,
    city: document.getElementById("city").value,
    area: document.getElementById("area").value,
    time: Date.now()
  };

  if(!data.name || !data.phone || !data.area){
    alert("Fill all fields");
    return;
  }

  db.collection("district_pro_bookings").add(data);

  alert("Booking Saved 🚀");
}

/* LIVE DATA */
db.collection("district_pro_bookings")
.orderBy("time","desc")
.onSnapshot(snapshot=>{

  let box=document.getElementById("data");
  box.innerHTML="";

  snapshot.forEach(doc=>{
    let d=doc.data();

    box.innerHTML += `
      <div class="card">
        <b>${d.name}</b><br>
        ${d.phone}<br>
        ${d.service}<br>
        ${d.city} - ${d.area}
      </div>
    `;
  });

});

</script>

</body>
</html>
