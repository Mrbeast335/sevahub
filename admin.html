<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
</head>
<body>

<h2>Admin Dashboard</h2>

<div id="bookings"></div>
<div id="providers"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
});

const auth = firebase.auth();
const db = firebase.firestore();

/* SECURITY CHECK */
auth.onAuthStateChanged(async user => {

  if(!user){
    document.body.innerHTML = "Login Required";
    return;
  }

  let doc = await db.collection("users").doc(user.uid).get();

  if(doc.data().role !== "admin"){
    document.body.innerHTML = "Access Denied";
    return;
  }

  loadAll();
});

/* BOOKINGS */
function loadAll(){

  db.collection("bookings").orderBy("time","desc")
  .onSnapshot(snap => {

    let box = document.getElementById("bookings");
    box.innerHTML = "<h3>Bookings</h3>";

    snap.forEach(doc => {
      let r = doc.data();

      box.innerHTML += `
        <div style="border:1px solid #000;padding:10px;margin:10px;">
          ${r.name} - ${r.phone}<br>
          ${r.service} - ${r.area}
        </div>
      `;
    });
  });

  /* PROVIDERS */
  db.collection("providers")
  .onSnapshot(snap => {

    let box = document.getElementById("providers");
    box.innerHTML = "<h3>Providers</h3>";

    snap.forEach(doc => {
      let r = doc.data();

      box.innerHTML += `
        <div style="border:1px solid green;padding:10px;margin:10px;">
          ${r.name} - ${r.service} - ${r.district}<br>
          Verified: ${r.verified}

          <button onclick="approve('${doc.id}')">Approve</button>
        </div>
      `;
    });
  });
}

/* APPROVE PROVIDER */
function approve(id){
  db.collection("providers").doc(id).update({
    verified: true
  });
}
</script>

</body>
</html>
